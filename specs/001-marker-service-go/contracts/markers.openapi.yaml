openapi: 3.0.0
info:
  title: MarkerService API
  version: 1.0.0
  description: RESTful API for managing geotagged markers with user isolation
  contact:
    name: API Support
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.example.com
    description: Production server (placeholder)

paths:
  /api/v1/markers:
    post:
      summary: Create a new marker
      operationId: createMarker
      tags:
        - Markers
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: User ID identifying the marker owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMarkerRequest'
      responses:
        '201':
          description: Marker created successfully
          headers:
            Location:
              schema:
                type: string
              description: URI of the created marker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkerResponse'
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: List markers for the authenticated user
      operationId: listMarkers
      tags:
        - Markers
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: User ID identifying the marker owner
        - name: category
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2, 3, 4]
          description: Optional category filter (1=General, 2=GroupCategory1_Marker1, 3=GroupCategory1_Marker2, 4=GroupCategory2_Marker1)
      responses:
        '200':
          description: List of markers for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarkerResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/markers/{markerId}:
    get:
      summary: Get a specific marker by ID
      operationId: getMarker
      tags:
        - Markers
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: User ID identifying the marker owner
        - name: markerId
          in: path
          required: true
          schema:
            type: string
          description: Marker ID (format: CATEGORY_v1.0_UNIXTIMESTAMP)
      responses:
        '200':
          description: Marker details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkerResponse'
        '400':
          description: Invalid marker ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Marker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: Update a marker (partial update)
      operationId: updateMarker
      tags:
        - Markers
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: User ID identifying the marker owner
        - name: markerId
          in: path
          required: true
          schema:
            type: string
          description: Marker ID (format: CATEGORY_v1.0_UNIXTIMESTAMP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMarkerRequest'
      responses:
        '200':
          description: Marker updated successfully (may have new ID if category changed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkerResponse'
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Marker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a marker
      operationId: deleteMarker
      tags:
        - Markers
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: User ID identifying the marker owner
        - name: markerId
          in: path
          required: true
          schema:
            type: string
          description: Marker ID (format: CATEGORY_v1.0_UNIXTIMESTAMP)
      responses:
        '204':
          description: Marker deleted successfully (no content)
        '400':
          description: Invalid marker ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Marker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /swagger:
    get:
      summary: Swagger UI documentation
      operationId: swagger
      tags:
        - Documentation
      responses:
        '200':
          description: Interactive API documentation

components:
  schemas:
    MarkerCategory:
      type: integer
      enum: [1, 2, 3, 4]
      description: |
        Marker category enumeration:
        - 1: General (generic/uncategorized)
        - 2: GroupCategory1_Marker1
        - 3: GroupCategory1_Marker2
        - 4: GroupCategory2_Marker1

    CreateMarkerRequest:
      type: object
      required:
        - name
        - category
        - latitude
        - longitude
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1000
          description: Human-readable marker name
          example: "Deer Sighting"
        category:
          $ref: '#/components/schemas/MarkerCategory'
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          description: Geographic north-south coordinate
          example: 45.5
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          description: Geographic east-west coordinate
          example: -93.2
        description:
          type: string
          nullable: true
          maxLength: 5000
          description: Optional detailed information about the marker
          example: "Large buck spotted near north fence"

    UpdateMarkerRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1000
          description: Updated marker name (optional)
          example: "Deer Sighting Updated"
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          description: Updated geographic north-south coordinate (optional)
          example: 45.6
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          description: Updated geographic east-west coordinate (optional)
          example: -93.1
        description:
          type: string
          nullable: true
          maxLength: 5000
          description: Updated detailed information (optional); null clears description
          example: "Updated sighting information"

    MarkerResponse:
      type: object
      required:
        - id
        - name
        - category
        - latitude
        - longitude
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Marker ID (format CATEGORY_v1.0_UNIXTIMESTAMP)
          example: "GroupCategory1_Marker1_v1.0_1707999893"
        name:
          type: string
          description: Marker name
          example: "Deer Sighting"
        category:
          $ref: '#/components/schemas/MarkerCategory'
        latitude:
          type: number
          format: float
          description: Geographic north-south coordinate
          example: 45.5
        longitude:
          type: number
          format: float
          description: Geographic east-west coordinate
          example: -93.2
        description:
          type: string
          nullable: true
          description: Optional detailed information
          example: "Large buck spotted near north fence"
        created_at:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp (UTC)
          example: "2026-02-15T13:44:53Z"
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 last update timestamp (UTC)
          example: "2026-02-15T13:44:53Z"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message
          example: "Marker not found"
